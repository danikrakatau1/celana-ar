name = "celana-ar-tempmail"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Daftar domain temp-mail (pisahkan koma). Domain pertama = utama.
DOMAINS = "celana-ar-store.my.id,dini-faqih.my.id"

[[durable_objects.bindings]]
name = "INBOX_STORE"
class_name = "InboxStore"

[[migrations]]
tag = "v1"
new_classes = ["InboxStore"]

# KV lama (tidak dipakai lagi sejak migrasi Durable Objects 2026-10-19;
