name = "celana-ar"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Daftar domain temp-mail (pisahkan koma). Domain pertama = utama.
DOMAINS = "celana-ar-store.my.id,dini-faqih.my.id,anif-tools.my.id,4n1f-tutorial.my.id,4n1f.my.id,4n1f-tutorial.web.id,4nif.my.id,anif.biz.id,anif.my.id,anif-promo.my.id,anifstore.my.id,celanaar.biz.id,celanaar.my.id,celana-arstore.biz.id,celana-arstore.my.id,celana-arstore.web.id,celanaar.web.id,dinzzz.my.id,moai.my.id,official-arstore.my.id,shopee-arstore.biz.id,shopee-arstore.my.id,tiktok-arstore.my.id,tiktok-arstore.web.id,toko-arstore.my.id,undangankuuu.my.id,vardz.my.id"

[[durable_objects.bindings]]
name = "INBOX_STORE"
class_name = "InboxStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InboxStore"]

# KV lama (tidak dipakai lagi sejak migrasi Durable Objects 2026-10-19;
# data lama expired sendiri max 2 jam). ID arsip: c17238a26010462e8a47cbc20f3b3cbc

# --- Custom domain (pilih salah satu cara) ---
# Cara 1 (disarankan): dashboard Worker > Settings > Domains & Routes
#          > Add Custom Domain, misal: mail.celana-ar-store.my.id
# Cara 2: uncomment blok di bawah ini lalu push ulang
# Domain utama dilayani Worker lewat route ini (sejak 17 Nov 2026 TempMail
# pindah ke domain utama; host mail.* tetap custom domain + redirect 301
# di worker.js).
[[routes]]
pattern = "celana-ar-store.my.id/*"
zone_name = "celana-ar-store.my.id"

# --- Static Assets: file pisah versi /anif ---
# Tanpa binding = aset disajiin dulu, sisanya jatuh ke Worker (/, /api/*, /lite tetap jalan).
[assets]
directory = "./public"
